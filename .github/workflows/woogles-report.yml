name: Woogles report email

# Fires at :12 and :42 past every hour in two windows: 08:12-10:42 UTC
# (3:12am-5:42am Central Daylight Time, an early attempt before the day's
# peak GitHub Actions crunch) and 13:12-23:42 UTC (8:12am-6:42pm CDT, the
# original daytime fallback). Either window retries every 30 minutes until
# the report actually sends (generate_report_email.py skips re-sending once
# today's report has already gone out, and skips sending at all while every
# collection is still pending analysis) — so if the early window finds
# nothing new to report yet, the daytime window keeps trying. Central is
# UTC-5 during CDT (Mar-Nov) and UTC-6 during CST (Nov-Mar), so both windows
# run an hour earlier — roughly 2:12am-4:42am and 7:12am-5:42pm — during CST.
# Minutes are offset away from :00/:05/:30/:35 since GitHub Actions scheduled
# runs queue behind everyone else's cron jobs at those popular
# top-of-hour/half-hour marks.
on:
  schedule:
    - cron: "12,42 8-10,13-23 * * *"
  workflow_dispatch:
    inputs:
      target_username:
        description: "Woogles username to report on for a one-off send — all of their collections (leave blank for Jesse's daily report)"
        required: false
        default: ""
      target_collection_uuid:
        description: "Specific collection UUID to report on for a one-off send, e.g. from a woogles.io/collections/<uuid> URL (overrides target_username's full-profile scope)"
        required: false
        default: ""
      recipient_email:
        description: "Email address to send a one-off report to (leave blank to use the default recipient)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Fetch send-status and rate-limit markers from woogles-data branch
        run: |
          mkdir -p data
          git fetch origin woogles-data
          git show origin/woogles-data:data/rate-limited-until.txt > data/rate-limited-until.txt 2>/dev/null || echo "" > data/rate-limited-until.txt
          if [ "${{ github.event.inputs.target_username }}" = "" ] && [ "${{ github.event.inputs.target_collection_uuid }}" = "" ]; then
            git show origin/woogles-data:data/last-report-sent.txt > data/last-report-sent.txt 2>/dev/null || echo "" > data/last-report-sent.txt
          fi

      - name: Fetch fresh snapshot (requests analysis for pending games)
        run: python scripts/fetch_woogles_snapshot.py
        env:
          WOOGLES_API_KEY: ${{ secrets.WOOGLES_API_KEY }}
          TARGET_USERNAME: ${{ github.event.inputs.target_username }}
          TARGET_COLLECTION_UUID: ${{ github.event.inputs.target_collection_uuid }}

      - run: python scripts/generate_report_email.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TARGET_USERNAME: ${{ github.event.inputs.target_username }}
          TARGET_COLLECTION_UUID: ${{ github.event.inputs.target_collection_uuid }}
          RECIPIENT_EMAIL: ${{ github.event.inputs.recipient_email }}

      - name: Commit updated report state
        if: ${{ github.event.inputs.target_username == '' && github.event.inputs.target_collection_uuid == '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/report-state.json
          git diff --cached --quiet || git commit -m "Update report state ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push origin HEAD:master

      - name: Enrich the Curley tracker sheet with fresh analysis
        if: ${{ github.event.inputs.target_username == '' && github.event.inputs.target_collection_uuid == '' }}
        env:
          CURLEY_SA_KEY_JSON: ${{ secrets.CURLEY_SA_KEY_JSON }}
          CURLEY_TRACKER_SHEET_ID: ${{ secrets.CURLEY_TRACKER_SHEET_ID }}
          # enrichment now pulls stats straight from the Woogles analysis API
          WOOGLES_API_KEY: ${{ secrets.WOOGLES_API_KEY }}
        run: |
          if [ -z "$CURLEY_SA_KEY_JSON" ] || [ -z "$CURLEY_TRACKER_SHEET_ID" ]; then
            echo "Curley tracker secrets not configured — skipping enrichment."
            exit 0
          fi
          printf '%s' "$CURLEY_SA_KEY_JSON" > "$RUNNER_TEMP/curley-sa.json"
          GOOGLE_SA_KEYFILE="$RUNNER_TEMP/curley-sa.json" \
            python scripts/update_curley_tracker.py --enrich-collection --skip-if-unconfigured

      - name: Publish fresh snapshot, rate-limit, and send-status markers to woogles-data branch
        run: |
          cp data/rate-limited-until.txt /tmp/rate-limited-until.txt
          cp data/woogles-snapshot.json /tmp/woogles-snapshot.json
          one_off=false
          if [ "${{ github.event.inputs.target_username }}" != "" ] || [ "${{ github.event.inputs.target_collection_uuid }}" != "" ]; then
            one_off=true
          else
            cp data/last-report-sent.txt /tmp/last-report-sent.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin woogles-data
          git checkout -B woogles-data origin/woogles-data
          cp /tmp/rate-limited-until.txt data/rate-limited-until.txt
          git add -f data/rate-limited-until.txt
          if [ "$one_off" = false ]; then
            cp /tmp/last-report-sent.txt data/last-report-sent.txt
            cp /tmp/woogles-snapshot.json data/woogles-snapshot.json
            git add -f data/last-report-sent.txt data/woogles-snapshot.json
          fi
          git diff --cached --quiet && echo "Nothing changed — nothing to record." || (git commit -m "Update snapshot / rate-limit / report-sent markers ($(date -u +%Y-%m-%dT%H:%M:%SZ))" && git push origin woogles-data)

      # Last on purpose: a failure here turns the workflow red (the alert)
      # without blocking the report/marker steps above. Scope: ONLY games the
      # OTB photo/OCR pipeline reconstructed (listed in
      # .github/ocr-game-manifest.txt) — games uploaded by other means are
      # trusted as uploaded and never audited.
      - name: Audit OCR-reconstructed games (tracker / live / repo consistency)
        if: ${{ github.event.inputs.target_username == '' && github.event.inputs.target_collection_uuid == '' }}
        env:
          WOOGLES_API_KEY: ${{ secrets.WOOGLES_API_KEY }}
          CURLEY_SA_KEY_JSON: ${{ secrets.CURLEY_SA_KEY_JSON }}
          CURLEY_TRACKER_SHEET_ID: ${{ secrets.CURLEY_TRACKER_SHEET_ID }}
        run: |
          if [ -z "$CURLEY_SA_KEY_JSON" ] || [ -z "$CURLEY_TRACKER_SHEET_ID" ]; then
            echo "Curley tracker secrets not configured — skipping audit."
            exit 0
          fi
          git checkout master  # the marker step above leaves us on woogles-data
          printf '%s' "$CURLEY_SA_KEY_JSON" > "$RUNNER_TEMP/curley-sa.json"
          GOOGLE_SA_KEYFILE="$RUNNER_TEMP/curley-sa.json" \
            python scripts/audit_woogles_consistency.py
